<!-- كارت التوجيه الذكي للمواقع المجانية -->
<div class="dakji-hero">
    <h2>تحويل الصورة لأنيميشن كرتون بذكاء اصطناعي مجاني 🚀</h2>
    <p>اختر المنصة اللي تحب تحول صورتك عليها بنقرة واحدة (الـ Prompt مكتوبة وجاهزة!):</p>

    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 20px;">
        
        <!-- خيار 1: Bing Image Creator (Prompt تلقائي) -->
        <button class="action-btn" onclick="openBingCreator()" style="background: #0078d4;">
            🎨 التحويل لـ أنمي / كرتون (عبر Bing AI)
        </button>

        <!-- خيار 2: Kling AI (نسخ تلقائي للوصف + فتح الموقع) -->
        <button class="action-btn" onclick="openKlingAI()" style="background: #ff4757;">
            🎬 تحريك الصورة كرتونياً (عبر Kling AI)
        </button>

    </div>
</div>

<script>
    // الـ Prompt السينمائية الاحترافية لتحويل الصور لـ أنمي بستايل باتمان والكوميكس
    const animePrompt = "Transform this image into a dark cinematic Batman comic book style anime animation, highly detailed, dramatic lighting, gotham vibe, action pose";

    function openBingCreator() {
        // تمرير الـ Prompt مباشرة في رابط Bing
        const bingUrl = `https://www.bing.com/images/create?q=${encodeURIComponent(animePrompt)}`;
        window.open(bingUrl, '_blank');
    }

    function openKlingAI() {
        // نسخ الـ Prompt تلقائياً وفتح موقع Kling AI
        navigator.clipboard.writeText(animePrompt).then(() => {
            alert("تم نسخ وصف الأنمي (Prompt) تلقائياً! 📋\nكل ما عليك هو رفع صورتك ولصق (Paste) الوصف في موقع Kling AI.");
            window.open('https://klingai.com/', '_blank');
        }).catch(err => {
            window.open('https://klingai.com/', '_blank');
        });
    }
</script>
